# =====================================================================
#  URBAN PICKLE: FAQS, BOOKING POLICY & CLUB GUIDELINES
# =====================================================================
#  The Help page (help) is built from this file.
#
#  - faqs: the questions shown under "FAQs". Each entry has a
#    "question" and an "answer".
#
#  HOW TO EDIT SAFELY
#   - Keep the spaces at the start of each line exactly as they are.
#     Use spaces, never the Tab key.
#   - Only change the text after the colon ( : ). Never rename the
#     words before the colon.
#   - Lines starting with # are notes and are ignored.
#   - Each entry is one "- " item. Keep the dash and the space.
#   - The text can contain simple links, e.g.
#     <a href="visit">Visit us</a>
#   - Business details such as {{ business.name }} or
#     {{ business.hoursLine }} are filled in automatically from
#     business.yaml. Keep those placeholders as they are.
#   - If a value contains a colon ( : ) or a # sign, wrap it in quotes.
#
#  If you make a mistake, the build fails with a message naming the
#  field to fix, and the live site keeps its previous version.
# =====================================================================

general:
  - question: "Where is {{ business.name }} located, and what are your operating hours?"
    answer: >
      We're at {{ business.addressLine }}.
      <br>We're open {{ business.hoursLine }}.

  - question: "Is parking available at the venue?"
    answer: >
      There's a little free parking at the entrance, but it fills up fast.
      <br>If it's full, try {{ business.parking.name }} facing the main road. It's a flat
      {{ business.currency }}{{ business.parking.price }} on weekdays after 5pm and all day on
      weekends. Just validate your ticket at our counter.

  - question: "What should I wear on court?"
    answer: >
      Sportswear and non-marking court shoes, like pickleball, tennis or badminton shoes.
      Please skip running shoes with dark soles, sandals, heels and bare feet. They damage the
      court surface.

  - question: "Do you provide paddle and ball rentals?"
    answer: >
      Yes, you can rent paddles and buy balls at the counter. You're welcome to bring your own too.

  - question: "Are children allowed at {{ business.name }}?"
    answer: >
      Of course! Kids aged 12 and under just need a parent or another adult with them the whole
      time. That adult is responsible for the child's safety and any damage to the facilities.

  - question: "I'm new to pickleball. Can I still come and play?"
    answer: >
      Definitely. Rent a paddle at the counter and book any court. If you'd like a hand getting
      started, ask us about coaching on WhatsApp, or join our
      <a href="{{ business.whatsappCommunityUrl | escape }}" target="_blank" rel="noopener noreferrer"
        >community chat<span class="arrow" aria-hidden="true">↗</span></a
      > to find people to play with.

  - question: "What's the difference between covered and open-air courts?"
    answer: >
      Covered courts have a roof overhead, so you're out of the sun and light rain. Open-air courts
      cost a bit less. Both are the same size, and you can see every rate on our
      <a href="pricing">pricing page</a>.

  - question: "When is the cheapest time to play?"
    answer: >
      Weekdays before 5pm and after 10pm. Open-air courts start from
      {{ business.currency }}{{ business.fromPrice.open }} an hour and covered courts from
      {{ business.currency }}{{ business.fromPrice.covered }}.

  - question: "Is there food, and can I shower after?"
    answer: >
      Yes to both. Haven Club Cafe is right beside the courts for food and drinks, and we have
      changing rooms and showers.

  - question: "Can I bring my dog?"
    answer: >
      Yes, we're pet-friendly. Message us on WhatsApp if you'd like to check anything first.

  - question: "Do you host corporate events, tournaments, or private group bookings?"
    answer: >
      Yes! For group bookings, private tournaments, coaching clinics or company events, message us
      on WhatsApp at
      <a href="{{ business.whatsappUrl | escape }}" target="_blank" rel="noopener noreferrer"
        >{{ business.phone }}<span class="arrow" aria-hidden="true">↗</span></a
      > and we'll put together something that suits your group.

bookings:
  - question: "How do I book a court at {{ business.name }}?"
    answer: >
      There are two ways:
      <br>- Online through Courtsite,
      <a href="{{ business.bookingUrl | escape }}" target="_blank" rel="noopener noreferrer"
        >here<span class="arrow" aria-hidden="true">↗</span></a
      >. Pick a date, time and court, pay online and you're confirmed straight away.
      <br>- On WhatsApp at
      <a href="{{ business.whatsappUrl | escape }}" target="_blank" rel="noopener noreferrer"
        >{{ business.phone }}<span class="arrow" aria-hidden="true">↗</span></a
      >. Tell us the date, time and how long you want to play. We'll check what's free and
      send our bank details to lock it in.

  - question: "Can I walk in without a booking?"
    answer: >
      You can, if a court is free. Weekday evenings and weekends get busy, so we'd book ahead
      to be safe.

  - question: "What payment methods are accepted?"
    answer: >
      On Courtsite you can pay with FPX online banking, credit or debit card, and some e-wallets.
      For WhatsApp bookings, we take bank transfer. Your slot is confirmed once we've got the
      payment and you've sent us the receipt.

cancellations:
  - question: "What is your cancellation and refund policy?"
    answer: >
      Sorry, we can't refund or carry forward sessions that are missed or not used. Please
      double-check your plans before you book.

  - question: "Can I reschedule my booking if my plans change?"
    answer: >
      Yes, as long as you let us know at least 72 hours before your session. It depends on what's
      available, and you can change each booking once.

  - question: "How do I request a booking time change?"
    answer: >
      If your session is more than 72 hours away, WhatsApp us at
      <a href="{{ business.whatsappUrl | escape }}" target="_blank" rel="noopener noreferrer"
        >{{ business.phone }}<span class="arrow" aria-hidden="true">↗</span></a
      > with your booking reference and the new date and time you'd like.

  - question: "What happens if it rains during my session?"
    answer: >
      If rain stops play before you've played 35 minutes, we'll reschedule you for free.
      We don't give cash refunds for rain, though.

  - question: "How do I claim a rain-affected reschedule, and how long do I have to use it?"
    answer: >
      WhatsApp us at
      <a href="{{ business.whatsappUrl | escape }}" target="_blank" rel="noopener noreferrer"
        >{{ business.phone }}<span class="arrow" aria-hidden="true">↗</span></a
      > within 48 hours of your original booking time. Your new session needs to be within one
      month of the original date, depending on what's available.

  - question: "What if it rains after we have already played for 35 minutes or more?"
    answer: >
      Once you've played 35 minutes or more, the session counts as used, so we can't reschedule or
      refund it.
