name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Only a failed build blocks deployment.
      - name: Build
        run: npm run build

      # Lint results are reported as warnings but never block deployment.
      - name: Check formatting
        run: npm run format:check
        continue-on-error: true
      - name: Lint CSS
        run: npm run lint:css
        continue-on-error: true
      - name: Lint HTML
        run: npm run lint:html
        continue-on-error: true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Tell Bing / IndexNow (used by ChatGPT search) that the site changed. Never blocks.
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          curl -sf -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json" -d '{
            "host": "urbanpickle.com.my",
            "key": "42518ffbf9294b8190bcf519e5adcbd4",
            "keyLocation": "https://urbanpickle.com.my/42518ffbf9294b8190bcf519e5adcbd4.txt",
            "urlList": [
              "https://urbanpickle.com.my/", "https://urbanpickle.com.my/courts",
              "https://urbanpickle.com.my/pricing", "https://urbanpickle.com.my/about",
              "https://urbanpickle.com.my/events", "https://urbanpickle.com.my/visit",
              "https://urbanpickle.com.my/gallery", "https://urbanpickle.com.my/help"
            ]
          }'
